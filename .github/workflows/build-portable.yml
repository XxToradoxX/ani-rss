name: build-portable

# 打包 Windows 便携版(含精简运行时) 并发布到本仓库的 Release
#
# 触发方式:
#   1. 手动: Actions -> build-portable -> Run workflow, 填入 tag(如 v3.2.46)
#   2. 打 tag: git tag v3.2.46 && git push origin v3.2.46
#
# 程序内的"检测更新"会读取本仓库的 releases/latest, 并按运行形态匹配资产:
#   ani-rss.jar            <- 以 jar 方式运行
#   ani-rss.exe            <- 直接运行 exe
#   ani-rss-portable.zip   <- exe 同级存在 jre 目录(便携版)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag (如 v3.2.46)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Put Git Bash on PATH
        # windows profile 里的 generate-resources.sh 需要 bash 下载 ani-rss-update.exe
        run: echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build portable package
        shell: pwsh
        run: ./build-windows-portable.ps1

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$pom = Get-Content ./pom.xml
          $v = $pom.project.version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "version = $v"

      - name: Zip portable package
        shell: pwsh
        run: |
          # 直接压缩目录内容, 解压后即为 exe + jar + jre 三件套, 不含多余的中间目录
          Compress-Archive -Path ./ani-rss-application/target/ani-rss-win/* `
                           -DestinationPath ./ani-rss-portable.zip `
                           -CompressionLevel Optimal

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: UPDATE.md
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          append_body: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./ani-rss-application/target/ani-rss.jar
            ./ani-rss-application/target/ani-rss.exe
            ./ani-rss-portable.zip
