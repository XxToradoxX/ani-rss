name: build-portable

# Build the self-contained Windows portable package and publish it to THIS repo's Release.
#
# Triggers:
#   1. manual: Actions -> build-portable -> Run workflow, supply a tag (e.g. v3.2.46)
#   2. tag push: git tag v3.2.46 && git push origin v3.2.46
#
# The in-app "check for update" reads this repo's releases/latest and picks the
# asset that matches how the program is running:
#   ani-rss.jar            <- running as a jar
#   ani-rss.exe            <- running as a plain exe
#   ani-rss-portable.zip   <- a "jre" directory sits next to the exe (portable)
#
# NOTE: keep this file ASCII-only. Non-ASCII text in a file without a BOM is
#       misread as ANSI on Windows runners.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (e.g. v3.2.46)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Put Git Bash on PATH
        # the windows maven profile runs generate-resources.sh, which needs bash and curl
        run: echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build portable package
        shell: pwsh
        run: ./build-windows-portable.ps1

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $pomText = Get-Content ./pom.xml -Raw -Encoding UTF8
          if ($pomText -match '<version>([^<]+)</version>') {
            "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "version = $($Matches[1])"
          } else {
            throw 'cannot read project version from pom.xml'
          }

      - name: Zip portable package
        shell: pwsh
        run: |
          # zip the contents, so extracting yields ani-rss.exe + ani-rss.jar + jre\ directly
          Compress-Archive -Path ./ani-rss-application/target/ani-rss-win/* `
                           -DestinationPath ./ani-rss-portable.zip `
                           -CompressionLevel Optimal

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: UPDATE.md
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          append_body: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./ani-rss-application/target/ani-rss.jar
            ./ani-rss-application/target/ani-rss.exe
            ./ani-rss-portable.zip
